<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmployeeHub - Reset Password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <div class="brand">EmployeeHub</div>
      <div>
        <div class="tagline">Buat password baru untuk akun Anda.</div>
        <div class="sub">Link ini hanya berlaku selama 1 jam sejak diminta.</div>
      </div>
      <div class="sub" style="font-size:12px;">Gunakan minimal 8 karakter dengan kombinasi huruf dan angka.</div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="lead" id="lead-text">Masukkan password baru Anda.</p>
        <div id="error-box" class="error-msg hidden"></div>
        <div id="success-box" class="hidden" style="background:var(--success-soft);color:var(--success);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:14px;">
          Password berhasil diubah. Mengalihkan ke halaman login…
        </div>
        <form id="reset-form">
          <div class="field">
            <label for="new-password">Password Baru</label>
            <input id="new-password" type="password" required placeholder="Min. 8 karakter, huruf + angka" />
          </div>
          <div class="field">
            <label for="confirm-password">Konfirmasi Password</label>
            <input id="confirm-password" type="password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="reset-btn">Simpan Password Baru</button>
        </form>
        <p class="small muted mt-16"><a href="/index.html">‹ Kembali ke halaman login</a></p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
