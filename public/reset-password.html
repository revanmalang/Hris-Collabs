<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmployeeHub — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <div class="brand">Employee<span class="dot">Hub</span></div>
      <div>
        <div class="tagline">Buat password baru untuk akun Anda.</div>
        <div class="sub">Link ini hanya berlaku selama 1 jam sejak diminta.</div>
      </div>
      <svg class="clockface" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="98" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <line x1="100" y1="100" x2="100" y2="45" stroke="#A8763B" stroke-width="3" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="140" y2="100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="lead" id="lead-text">Masukkan password baru Anda.</p>
        <div id="error-box" class="error-msg hidden"></div>
        <div id="success-box" class="hidden" style="background:var(--green-100);color:var(--green);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:14px;">
          Password berhasil diubah. Mengalihkan ke halaman login…
        </div>
        <form id="reset-form">
          <div class="field">
            <label for="new-password">Password Baru</label>
            <input id="new-password" type="password" required placeholder="Min. 8 karakter, huruf + angka" />
          </div>
          <div class="field">
            <label for="confirm-password">Konfirmasi Password</label>
            <input id="confirm-password" type="password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="reset-btn">Simpan Password Baru</button>
        </form>
        <p class="small muted mt-16"><a href="/index.html">‹ Kembali ke halaman login</a></p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const errorBox = document.getElementById('error-box');

    if (!token) {
      document.getElementById('lead-text').textContent = 'Link reset tidak valid.';
      errorBox.textContent = 'Token tidak ditemukan pada URL. Minta link reset baru dari halaman login.';
      errorBox.classList.remove('hidden');
      form.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (pw !== confirm) {
        errorBox.textContent = 'Konfirmasi password tidak cocok.';
        errorBox.classList.remove('hidden');
        return;
      }
      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan…';
      try {
        await api('/auth/reset-password', { method: 'POST', body: { token, newPassword: pw } });
        form.classList.add('hidden');
        document.getElementById('success-box').classList.remove('hidden');
        setTimeout(() => { window.location.href = '/index.html'; }, 2000);
      } catch (err) {
        errorBox.textContent = err.message || 'Gagal mereset password. Link mungkin sudah kedaluwarsa.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Simpan Password Baru';
      }
    });
  </script>
</body>
</html>
